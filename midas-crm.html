<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Midas CRM — Quản lý Khách hàng &amp; Deal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
/* ============================================================
   MIDAS CRM — Design tokens
   White/light background, blue glassmorphism, industrial line icons
   Montserrat (unified across headings, body, and data)
   ============================================================ */
:root{
  --bg: #f5f7fb;
  --bg-grid: #eef1f8;
  --surface: #ffffff;
  --surface-glass: rgba(255,255,255,0.72);
  --border: #e3e8f2;
  --border-strong: #c9d3e6;
  --ink: #101425;
  --ink-soft: #545e78;
  --ink-faint: #8892ab;
  --blue: #2f5eff;
  --blue-deep: #1c3ec7;
  --blue-soft: #eaf0ff;
  --blue-glass: rgba(47,94,255,0.08);
  --blue-glass-border: rgba(47,94,255,0.22);
  --red: #e5484d;
  --red-soft: #fdecec;
  --amber: #d98a1f;
  --amber-soft: #fdf3e2;
  --green: #1a9e6f;
  --green-soft: #e7f8f1;
  --violet: #7c5cff;
  --violet-soft: #f1edff;
  --gray-soft: #eef1f6;
  --radius-sm: 8px;
  --radius: 14px;
  --radius-lg: 20px;
  --shadow-sm: 0 1px 2px rgba(16,20,37,0.04), 0 1px 1px rgba(16,20,37,0.03);
  --shadow: 0 8px 24px -8px rgba(28,45,120,0.14);
  --shadow-lg: 0 24px 60px -16px rgba(28,45,120,0.24);
}

*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
body{
  font-family:'Montserrat',sans-serif;
  background:
    radial-gradient(circle at 12% 0%, rgba(47,94,255,0.06), transparent 40%),
    var(--bg);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
  font-size:14px;
  line-height:1.5;
}
h1,h2,h3,h4{font-family:'Montserrat',sans-serif; letter-spacing:-0.01em;}
.mono{font-family:'Montserrat',sans-serif; font-variant-numeric:tabular-nums;}
button{font-family:inherit; cursor:pointer;}
input,select,textarea{font-family:inherit; font-size:14px;}
a{color:inherit;}
::-webkit-scrollbar{width:8px; height:8px;}
::-webkit-scrollbar-thumb{background:var(--border-strong); border-radius:8px;}
::-webkit-scrollbar-track{background:transparent;}

/* ---------- Icons (industrial line style) ---------- */
.icon{width:18px; height:18px; stroke:currentColor; fill:none; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round; flex-shrink:0;}

/* ---------- App shell ---------- */
.app{display:grid; grid-template-columns:236px 1fr; min-height:100vh;}

/* ---------- Sidebar ---------- */
.sidebar{
  background:var(--surface);
  border-right:1px solid var(--border);
  padding:20px 14px;
  display:flex; flex-direction:column;
  position:sticky; top:0; height:100vh;
}
.brand{display:flex; flex-direction:column; align-items:flex-start; gap:8px; padding:6px 8px 22px 8px;}
.brand-logo{height:30px; width:auto; display:block;}
.brand-tag{font-size:10px; color:var(--ink-faint); font-family:'Montserrat'; letter-spacing:0.08em; text-transform:uppercase; font-weight:600; padding-left:1px;}

.nav{display:flex; flex-direction:column; gap:2px; flex:1;}
.nav-item{
  display:flex; align-items:center; gap:11px;
  padding:9px 12px; border-radius:10px;
  color:var(--ink-soft); font-weight:500; font-size:13.5px;
  border:1px solid transparent; background:none; text-align:left; width:100%;
  transition:background .12s, color .12s;
  position:relative;
}
.nav-item .icon{width:17px; height:17px;}
.nav-item:hover{background:var(--gray-soft); color:var(--ink);}
.nav-item.active{
  background:var(--blue-glass); color:var(--blue-deep); border-color:var(--blue-glass-border); font-weight:600;
}
.nav-badge{
  margin-left:auto; font-family:'Montserrat'; font-size:10.5px; font-weight:600;
  background:var(--red-soft); color:var(--red); border-radius:20px; padding:1px 7px;
}
.nav-section-label{font-size:10.5px; text-transform:uppercase; letter-spacing:0.08em; color:var(--ink-faint); font-weight:600; padding:14px 12px 6px;}

.sidebar-foot{border-top:1px solid var(--border); padding-top:12px; margin-top:8px; display:flex; flex-direction:column; gap:6px;}
.sidebar-foot .nav-item{font-size:12.5px;}

/* ---------- Main ---------- */
.main{padding:26px 32px 60px; max-width:1400px; width:100%;}
.main-dashboard-bg{
  background:
    radial-gradient(circle at 10% 0%, rgba(214,168,60,0.13), transparent 42%),
    radial-gradient(circle at 92% 6%, rgba(245,214,120,0.12), transparent 40%);
  border-radius:0 0 24px 24px;
}
.topbar{display:flex; align-items:center; justify-content:space-between; gap:16px; margin-bottom:24px; flex-wrap:wrap;}
.topbar h1{font-size:22px; font-weight:700;}
.topbar-sub{color:var(--ink-faint); font-size:12.5px; margin-top:3px; font-family:'Montserrat';}
.topbar-actions{display:flex; gap:10px; align-items:center; flex-wrap:wrap;}

.search-box{
  display:flex; align-items:center; gap:8px;
  background:var(--surface); border:1px solid var(--border); border-radius:10px;
  padding:8px 12px; min-width:260px;
}
.search-box input{border:none; outline:none; background:none; flex:1; font-size:13.5px;}
.search-box .icon{color:var(--ink-faint); width:16px; height:16px;}

/* ---------- Buttons ---------- */
.btn{
  display:inline-flex; align-items:center; gap:7px;
  padding:9px 15px; border-radius:10px; border:1px solid var(--border);
  background:var(--surface); color:var(--ink); font-weight:600; font-size:13px;
  transition:all .12s;
  white-space:nowrap;
}
.btn .icon{width:15px; height:15px;}
.btn:hover{border-color:var(--border-strong); background:var(--gray-soft);}
.btn-primary{background:linear-gradient(135deg, var(--blue), var(--blue-deep)); color:#fff; border:none; box-shadow:0 6px 16px -6px rgba(47,94,255,0.55);}
.btn-primary:hover{filter:brightness(1.06);}
.btn-ghost{background:none; border-color:transparent;}
.btn-ghost:hover{background:var(--gray-soft);}
.btn-danger{color:var(--red); border-color:var(--red-soft);}
.btn-danger:hover{background:var(--red-soft);}
.btn-sm{padding:6px 11px; font-size:12px; border-radius:8px;}
.btn:disabled{opacity:.45; cursor:not-allowed;}

/* ---------- Cards / glass ---------- */
.card{
  background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
  box-shadow:var(--shadow-sm);
}
.glass{
  background:var(--surface-glass); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
  border:1px solid var(--blue-glass-border);
}

/* ---------- KPI grid ---------- */
.kpi-grid{display:grid; grid-template-columns:repeat(4, 1fr); gap:14px; margin-bottom:20px;}
.kpi-card{
  padding:18px 18px 16px; border-radius:var(--radius); position:relative; overflow:hidden;
  background:var(--surface); border:1px solid var(--border); box-shadow:var(--shadow-sm);
}
.kpi-card::before{
  content:''; position:absolute; inset:0; opacity:.5; pointer-events:none;
  background:radial-gradient(circle at 100% 0%, var(--blue-glass), transparent 60%);
}
.kpi-top{display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;}
.kpi-icon{
  width:32px; height:32px; border-radius:9px; display:flex; align-items:center; justify-content:center;
  background:var(--blue-glass); color:var(--blue-deep); border:1px solid var(--blue-glass-border);
}
.kpi-icon.red{background:var(--red-soft); color:var(--red); border-color:transparent;}
.kpi-icon.amber{background:var(--amber-soft); color:var(--amber); border-color:transparent;}
.kpi-icon.green{background:var(--green-soft); color:var(--green); border-color:transparent;}
.kpi-icon.violet{background:var(--violet-soft); color:var(--violet); border-color:transparent;}
.kpi-label{font-size:12px; color:var(--ink-faint); font-weight:600;}
.kpi-value{font-family:'Montserrat'; font-size:26px; font-weight:700; margin-top:2px;}
.kpi-foot{font-size:11.5px; color:var(--ink-faint); margin-top:6px; font-family:'Montserrat';}

/* ---------- Alerts strip ---------- */
.alert-strip{display:flex; gap:10px; margin-bottom:20px; flex-wrap:wrap;}
.alert-pill{
  display:flex; align-items:center; gap:8px; padding:9px 14px; border-radius:11px; font-size:13px; font-weight:600;
  border:1px solid transparent; cursor:pointer; transition:transform .12s;
}
.alert-pill:hover{transform:translateY(-1px);}
.alert-pill.red{background:var(--red-soft); color:#b0262b;}
.alert-pill.amber{background:var(--amber-soft); color:#9a6712;}
.alert-pill.green{background:var(--green-soft); color:#0f7a53;}
.alert-pill .dot{width:7px; height:7px; border-radius:50%; background:currentColor;}
.alert-pill .count{font-family:'Montserrat'; font-weight:700;}

/* ---------- Section headers ---------- */
.section-head{display:flex; align-items:center; justify-content:space-between; margin:26px 0 12px;}
.section-head h3{font-size:15px; font-weight:700;}
.section-head .see-all{font-size:12.5px; color:var(--blue-deep); font-weight:600;}

.dash-grid{display:grid; grid-template-columns:1.3fr 1fr; gap:16px; align-items:start;}

/* ---------- Table ---------- */
.table-wrap{overflow-x:auto; border-radius:var(--radius); border:1px solid var(--border); background:var(--surface);}
table{width:100%; border-collapse:collapse; font-size:13px;}
thead th{
  text-align:left; padding:11px 14px; font-size:11px; text-transform:uppercase; letter-spacing:0.04em;
  color:var(--ink-faint); font-weight:700; border-bottom:1px solid var(--border); background:var(--bg-grid);
  white-space:nowrap;
}
tbody td{padding:12px 14px; border-bottom:1px solid var(--border); vertical-align:middle;}
tbody tr:last-child td{border-bottom:none;}
tbody tr{transition:background .1s;}
tbody tr.clickable{cursor:pointer;}
tbody tr.clickable:hover{background:var(--blue-glass);}
.cell-main{font-weight:600;}
.cell-sub{color:var(--ink-faint); font-size:12px; margin-top:1px;}
.cell-value{font-family:'Montserrat'; font-weight:600;}

/* ---------- Badges ---------- */
.badge{
  display:inline-flex; align-items:center; gap:5px; padding:3px 9px; border-radius:20px;
  font-size:11.5px; font-weight:700; white-space:nowrap; font-family:'Montserrat'; letter-spacing:0.01em;
}
.badge .dot{width:6px; height:6px; border-radius:50%; background:currentColor;}
.badge-priority{font-family:'Montserrat'; font-weight:600;}

/* ---------- Inline quick status select (looks like a badge, acts like a dropdown) ---------- */
.status-select{
  appearance:none; -webkit-appearance:none; -moz-appearance:none;
  border:none; border-radius:20px; padding:4px 24px 4px 10px;
  font-size:11.5px; font-weight:700; font-family:'Montserrat',sans-serif; letter-spacing:0.01em;
  cursor:pointer; outline:none; transition:filter .1s;
  background-repeat:no-repeat; background-position:right 8px center; background-size:9px;
  background-image:url("data:image/svg+xml;charset=UTF-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='rgba(16,20,37,0.45)' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M6 9l6 6 6-6'/%3E%3C/svg%3E");
}
.status-select:hover{filter:brightness(0.97);}
.status-select:focus{box-shadow:0 0 0 3px var(--blue-glass);}
.status-select option{color:var(--ink); background:var(--surface); font-weight:600;}

/* ---------- Filters bar ---------- */
.filters-bar{display:flex; gap:9px; flex-wrap:wrap; align-items:center; margin-bottom:16px;}
.select-chip, select.select-chip{
  padding:8px 12px; border-radius:9px; border:1px solid var(--border); background:var(--surface);
  font-size:12.5px; font-weight:600; color:var(--ink-soft); outline:none;
}
.chip-toggle{
  padding:8px 13px; border-radius:9px; border:1px solid var(--border); background:var(--surface);
  font-size:12.5px; font-weight:600; color:var(--ink-soft); display:flex; align-items:center; gap:6px;
}
.chip-toggle.active{background:var(--red-soft); color:#b0262b; border-color:transparent;}
.chip-toggle .icon{width:14px; height:14px;}

/* ---------- Date range filter (calendar-style popover) ---------- */
.date-filter-wrap{position:relative;}
.date-filter-panel{
  position:absolute; top:calc(100% + 6px); left:0; z-index:60; width:270px;
  background:var(--surface); border:1px solid var(--border); border-radius:12px; box-shadow:var(--shadow-lg);
  padding:14px; display:flex; flex-direction:column; gap:10px;
}
.date-filter-presets{display:flex; flex-direction:column; gap:5px;}
.date-filter-presets .chip-toggle{width:100%; justify-content:flex-start; text-align:left;}
.date-filter-presets .chip-toggle.active{background:var(--blue-glass); color:var(--blue-deep);}
.date-filter-divider{font-size:10px; color:var(--ink-faint); text-transform:uppercase; letter-spacing:0.05em; font-weight:700; border-top:1px solid var(--border); padding-top:10px;}
.date-filter-range{display:flex; gap:8px;}
.date-filter-range .form-field{flex:1; gap:4px;}
.date-filter-range .form-field label{font-size:10.5px;}
.date-filter-range input{padding:7px 8px; font-size:12.5px; width:100%;}
.date-filter-actions{display:flex; justify-content:space-between; gap:8px;}

/* ---------- Empty state ---------- */
.empty-state{
  display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center;
  padding:60px 20px; color:var(--ink-faint); gap:10px;
}
.empty-state .icon{width:38px; height:38px; color:var(--border-strong); stroke-width:1.3;}
.empty-state b{color:var(--ink-soft); font-family:'Montserrat'; font-size:15px;}

/* ---------- Modal ---------- */
.modal-overlay{
  position:fixed; inset:0; background:rgba(16,20,37,0.42); backdrop-filter:blur(3px);
  display:flex; align-items:flex-start; justify-content:center; padding:40px 16px;
  z-index:100; overflow-y:auto; animation:fadeIn .15s ease;
}
@keyframes fadeIn{from{opacity:0} to{opacity:1}}
.modal{
  background:var(--surface); border-radius:var(--radius-lg); width:100%; max-width:640px;
  box-shadow:var(--shadow-lg); border:1px solid var(--border); animation:slideUp .18s ease;
  max-height:calc(100vh - 80px); display:flex; flex-direction:column;
}
.modal.modal-lg{max-width:840px;}
@keyframes slideUp{from{opacity:0; transform:translateY(10px)} to{opacity:1; transform:translateY(0)}}
.modal-head{display:flex; align-items:center; justify-content:space-between; padding:18px 22px; border-bottom:1px solid var(--border);}
.modal-head h3{font-size:16px; font-weight:700;}
.modal-close{width:30px; height:30px; border-radius:8px; display:flex; align-items:center; justify-content:center; border:1px solid var(--border); background:var(--surface); color:var(--ink-faint);}
.modal-close:hover{background:var(--gray-soft); color:var(--ink);}
.modal-body{padding:20px 22px; overflow-y:auto;}
.modal-foot{display:flex; justify-content:flex-end; gap:10px; padding:16px 22px; border-top:1px solid var(--border);}

.form-grid{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
.form-field{display:flex; flex-direction:column; gap:6px;}
.form-field.full{grid-column:1/-1;}
.form-field label{font-size:12px; font-weight:700; color:var(--ink-soft);}
.form-field .hint{font-size:10.5px; color:var(--ink-faint); font-weight:500;}
.form-field input, .form-field select, .form-field textarea{
  padding:9px 11px; border-radius:9px; border:1px solid var(--border); outline:none; background:var(--bg);
  transition:border-color .12s, background .12s;
}
.form-field input:focus, .form-field select:focus, .form-field textarea:focus{
  border-color:var(--blue); background:var(--surface); box-shadow:0 0 0 3px var(--blue-glass);
}
.form-field textarea{resize:vertical; min-height:70px;}
.form-divider{grid-column:1/-1; border-top:1px dashed var(--border); margin:4px 0 2px; padding-top:14px; font-size:12px; font-weight:700; color:var(--ink-faint); text-transform:uppercase; letter-spacing:0.04em;}

/* ---------- Detail panel ---------- */
.detail-grid{display:grid; grid-template-columns:220px 1fr; gap:22px;}
.detail-info dl{display:flex; flex-direction:column; gap:12px;}
.detail-info dt{font-size:10.5px; text-transform:uppercase; letter-spacing:0.05em; color:var(--ink-faint); font-weight:700; margin-bottom:2px;}
.detail-info dd{font-size:13px; font-weight:500;}
.detail-tabs{display:flex; gap:2px; border-bottom:1px solid var(--border); margin-bottom:16px; flex-wrap:wrap;}
.detail-tab{
  appearance:none; -webkit-appearance:none; -moz-appearance:none;
  padding:9px 4px; margin-right:20px; font-size:13px; font-weight:600; color:var(--ink-faint);
  border:none; border-bottom:2px solid transparent; background:none; outline:none; cursor:pointer;
  transition:color .12s, border-color .12s;
}
.detail-tab:hover{color:var(--ink-soft);}
.detail-tab.active{color:var(--blue-deep); border-bottom-color:var(--blue);}

.deal-mini-card{border:1px solid var(--border); border-radius:12px; padding:13px 14px; margin-bottom:10px; background:var(--bg);}
.deal-mini-top{display:flex; align-items:center; justify-content:space-between; margin-bottom:6px;}
.deal-mini-top .name{font-weight:700; font-size:13.5px;}
.deal-mini-meta{display:flex; gap:14px; flex-wrap:wrap; font-size:11.5px; color:var(--ink-faint); font-family:'Montserrat';}

.timeline{display:flex; flex-direction:column; gap:0; position:relative;}
.timeline-item{display:flex; gap:12px; padding-bottom:16px; position:relative;}
.timeline-item::before{content:''; position:absolute; left:5px; top:16px; bottom:0; width:1px; background:var(--border);}
.timeline-item:last-child::before{display:none;}
.timeline-dot{width:11px; height:11px; border-radius:50%; background:var(--blue); border:2px solid var(--blue-soft); margin-top:3px; flex-shrink:0;}
.timeline-body{flex:1;}
.timeline-date{font-size:11px; color:var(--ink-faint); font-family:'Montserrat'; font-weight:600;}
.timeline-text{font-size:13px; margin-top:2px;}
.next-action-box{
  margin-top:14px; padding:12px 14px; border-radius:11px; background:var(--blue-glass); border:1px solid var(--blue-glass-border);
  display:flex; align-items:center; gap:10px;
}
.next-action-box .icon{color:var(--blue-deep);}
.next-action-box b{font-family:'Montserrat'; font-size:13px;}

/* ---------- Kanban ---------- */
.kanban-wrap{display:flex; gap:14px; overflow-x:auto; padding-bottom:14px;}
.kanban-col{flex:0 0 268px; background:var(--bg-grid); border-radius:14px; padding:12px; border:1px solid var(--border); min-height:200px;}
.kanban-col-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; padding:0 2px;}
.kanban-col-head .title{font-size:12.5px; font-weight:700;}
.kanban-col-head .count{font-family:'Montserrat'; font-size:11px; color:var(--ink-faint); background:var(--surface); border:1px solid var(--border); padding:1px 7px; border-radius:20px;}
.kanban-col-sum{font-size:10.5px; color:var(--ink-faint); font-family:'Montserrat'; margin-bottom:8px; padding:0 2px;}
.kanban-col.drag-over{background:var(--blue-glass); border-color:var(--blue);}
.kanban-col-won{background:var(--green-soft); border-color:rgba(15,122,83,0.25);}
.kanban-col-won .kanban-col-head .title{color:#0f7a53;}
.kanban-cards{display:flex; flex-direction:column; gap:9px; min-height:40px;}
.kcard{
  background:var(--surface); border:1px solid var(--border); border-radius:11px; padding:11px 12px;
  cursor:grab; box-shadow:var(--shadow-sm); transition:box-shadow .12s, transform .12s;
}
.kcard:hover{box-shadow:var(--shadow); transform:translateY(-1px);}
.kcard.dragging{opacity:.4;}
.kcard .company{font-weight:700; font-size:12.5px;}
.kcard .project{font-size:11.5px; color:var(--ink-soft); margin-top:2px;}
.kcard .value{font-family:'Montserrat'; font-weight:700; font-size:12.5px; color:var(--blue-deep); margin-top:7px;}
.kcard-foot{display:flex; align-items:center; justify-content:space-between; margin-top:8px;}
.kcard-owner{font-size:10.5px; color:var(--ink-faint); font-family:'Montserrat';}

.kanban-lost-zone{
  margin-top:16px; border:2px dashed rgba(229,72,77,0.4); border-radius:14px;
  padding:12px 14px; background:rgba(229,72,77,0.03); transition:background .15s, border-color .15s;
}
.kanban-lost-zone.drag-over{background:var(--red-soft); border-color:var(--red);}
.kanban-lost-head{display:flex; align-items:center; justify-content:space-between; font-size:12.5px; font-weight:700; color:#b0262b; margin-bottom:10px; flex-wrap:wrap; gap:6px;}
.kanban-lost-head .icon{width:15px; height:15px; vertical-align:-3px; margin-right:2px;}
.kanban-lost-cards{display:flex; gap:10px; overflow-x:auto; padding-bottom:2px;}
.kanban-lost-cards .kcard{flex:0 0 210px; opacity:.72; filter:grayscale(0.25);}
.kanban-lost-cards .kcard:hover{opacity:1; filter:none;}
.kanban-lost-empty{font-size:12px; color:var(--ink-faint); padding:8px 4px;}

/* ---------- Reports ---------- */
.chart-card{padding:18px; border-radius:var(--radius); background:var(--surface); border:1px solid var(--border);}
.chart-card h4{font-size:13px; font-weight:700; margin-bottom:3px;}
.chart-desc{font-size:11.5px; color:var(--ink-faint); margin-bottom:14px; line-height:1.5;}

/* ---------- Toast ---------- */
.toast{
  position:fixed; bottom:22px; right:22px; background:var(--ink); color:#fff; padding:12px 18px; border-radius:11px;
  font-size:13px; font-weight:600; box-shadow:var(--shadow-lg); z-index:200; display:flex; align-items:center; gap:9px;
  animation:toastIn .2s ease;
}
.toast.error{background:var(--red);}
@keyframes toastIn{from{opacity:0; transform:translateY(8px)} to{opacity:1; transform:translateY(0)}}

/* ---------- Confirm dialog ---------- */
.confirm-box{max-width:380px; text-align:center; padding:26px 24px;}
.confirm-box .icon-wrap{width:46px; height:46px; border-radius:12px; background:var(--red-soft); color:var(--red); display:flex; align-items:center; justify-content:center; margin:0 auto 14px;}
.confirm-box h3{font-size:15.5px; margin-bottom:6px;}
.confirm-box p{font-size:13px; color:var(--ink-faint); margin-bottom:20px;}
.confirm-box .actions{display:flex; gap:10px; justify-content:center;}

/* ---------- Calendar ---------- */
.cal-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:6px;}
.cal-head-row{margin-bottom:6px;}
.cal-headcell{font-size:11px; font-weight:700; color:var(--ink-faint); text-align:center; padding:4px 0; text-transform:uppercase; letter-spacing:0.04em;}
.cal-cell{
  min-height:78px; border:1px solid var(--border); border-radius:10px; padding:6px;
  cursor:pointer; background:var(--surface); display:flex; flex-direction:column; gap:3px;
  transition:border-color .12s, background .12s; overflow:hidden;
}
.cal-cell:hover{border-color:var(--blue);}
.cal-cell.cal-empty{visibility:hidden; cursor:default; border:none;}
.cal-cell.cal-today{background:var(--blue-glass); border-color:var(--blue);}
.cal-daynum{font-size:11.5px; font-weight:700; color:var(--ink-soft);}
.cal-today .cal-daynum{color:var(--blue-deep);}
.cal-chip{font-size:9.5px; font-weight:600; background:var(--blue-glass); color:var(--blue-deep); border-radius:5px; padding:1.5px 5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.cal-more{font-size:9.5px; color:var(--ink-faint); font-weight:600;}
@media (max-width:760px){
  .cal-cell{min-height:52px; padding:4px;}
  .cal-chip{display:none;}
}

/* ---------- Settings ---------- */
.settings-grid{display:grid; grid-template-columns:1fr 1fr; gap:16px;}
.settings-card{padding:18px; border-radius:var(--radius); background:var(--surface); border:1px solid var(--border);}
.settings-card h4{font-size:14px; margin-bottom:6px;}
.settings-card p{font-size:12.5px; color:var(--ink-faint); margin-bottom:14px; line-height:1.6;}

.mobile-menu-btn{display:none; align-items:center; justify-content:center; width:36px; height:36px; border-radius:9px; border:1px solid var(--border); background:var(--surface); flex-shrink:0;}
.mobile-backdrop{display:none;}

/* ============================================================
   RESPONSIVE — tablet & mobile
   ============================================================ */

/* Tablet / small laptop */
@media (max-width:1080px){
  .kpi-grid{grid-template-columns:repeat(2,1fr);}
  .dash-grid{grid-template-columns:1fr;}
  .settings-grid{grid-template-columns:1fr;}
  .detail-grid{grid-template-columns:200px 1fr; gap:16px;}
}

/* Phones & narrow tablets */
@media (max-width:760px){
  .app{grid-template-columns:1fr;}
  .sidebar{position:fixed; z-index:90; left:-260px; top:0; transition:left .2s; width:236px; box-shadow:var(--shadow-lg);}
  .sidebar.open{left:0;}
  .mobile-backdrop{display:block; position:fixed; inset:0; background:rgba(16,20,37,0.4); z-index:80;}
  .mobile-menu-btn{display:flex !important;}
  .main{padding:16px 12px 50px; max-width:100%;}

  .topbar{gap:10px;}
  .topbar h1{font-size:19px;}
  .topbar-sub{font-size:11.5px;}
  .topbar-actions{width:100%;}
  .topbar-actions .btn{flex:1; justify-content:center;}

  .kpi-grid{grid-template-columns:1fr 1fr; gap:10px;}
  .kpi-card{padding:14px 14px 12px;}
  .kpi-value{font-size:21px;}

  .alert-strip{gap:8px;}
  .alert-pill{font-size:12px; padding:8px 11px; flex:1 1 auto;}

  .filters-bar{gap:7px;}
  .search-box{min-width:0; width:100%; flex:1 1 100%;}
  .select-chip, select.select-chip, .chip-toggle{font-size:12px; padding:7px 10px;}

  .form-grid{grid-template-columns:1fr;}
  .detail-grid{grid-template-columns:1fr; gap:18px;}

  /* Prevent iOS Safari auto-zoom on input focus (requires >=16px font-size) */
  .form-field input, .form-field select, .form-field textarea,
  .search-box input, .status-select, #statusUpdateText, #statusNADue, #newDealNote,
  #doc_title, #doc_url, #doc_note, #na_text, #na_due, #dateFilterFrom, #dateFilterTo {
    font-size:16px;
  }

  .modal-overlay{padding:0; align-items:flex-end;}
  .modal{max-width:100%; width:100%; border-radius:16px 16px 0 0; max-height:92vh;}
  .modal-head{padding:14px 16px;}
  .modal-body{padding:16px;}
  .modal-foot{padding:12px 16px; flex-wrap:wrap;}
  .modal-foot .btn{flex:1; justify-content:center;}

  .kanban-wrap{gap:10px;}
  .kanban-col{flex:0 0 240px; scroll-snap-align:start;}
  .kanban-wrap{scroll-snap-type:x proximity; -webkit-overflow-scrolling:touch;}

  .table-wrap{-webkit-overflow-scrolling:touch;}
  table{font-size:12.5px;}
  thead th{padding:9px 10px;}
  tbody td{padding:10px 10px;}

  .btn-sm{padding:7px 12px;}
  .dash-grid{gap:14px;}
  .cal-headcell{font-size:9.5px;}
}

/* Very small phones */
@media (max-width:400px){
  .kpi-grid{grid-template-columns:1fr;}
  .brand-logo{height:26px;}
}

.hidden{display:none !important;}
</style>

/* Đồng bộ 1 bảng: upsert toàn bộ record hiện có trong STATE, xoá record nào
   không còn trong STATE (khớp với UX "import đè toàn bộ" đã có sẵn của app). */
async function syncTable(table, rows, toRow){
  const payload = rows.map(toRow);
  if(payload.length){
    const { error: upErr } = await supabaseClient.from(table).upsert(payload, { onConflict:'id' });
    if(upErr) throw upErr;
  }
  const ids = rows.map(r=>r.id);
  let delQuery = supabaseClient.from(table).delete();
  delQuery = ids.length
    ? delQuery.not('id', 'in', `(${ids.map(id=>`"${String(id).replace(/"/g,'')}"`).join(',')})`)
    : delQuery.neq('id', '__none__');
  const { error: delErr } = await delQuery;
  if(delErr) throw delErr;

function statusMeta(id){ return CUSTOMER_STATUSES.find(s=>s.id===id) || CUSTOMER_STATUSES[0]; }
function renderStatusSelect(c){
  const sm = statusMeta(c.status);
  return `<select class="status-select" style="background-color:${sm.soft};color:${sm.color}"
    onclick="event.stopPropagation()"
    onchange="event.stopPropagation(); updateCustomerStatusInline('${c.id}', this.value)">
    ${CUSTOMER_STATUSES.map(s=>`<option value="${s.id}" ${c.status===s.id?'selected':''}>${s.label}</option>`).join('')}

function updateCustomerStatusInline(customerId, newStatus){
  const c = getCustomer(customerId);
  if(!c || c.status===newStatus) return;
  const oldLabel = statusMeta(c.status).label;
  c.status = newStatus;
  c.updatedAt = new Date().toISOString();
  addActivity(customerId, null, `Đổi trạng thái khách hàng: ${oldLabel} → ${statusMeta(newStatus).label}`);
  saveState();
  showToast(`Đã chuyển trạng thái sang "${statusMeta(newStatus).label}"`);
  render();
}

/* ---------------- Utilities ---------------- */
function uid(){ return 'id_' + Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4); }
function todayISO(){ return new Date().toISOString().slice(0,10); }
function fmtDate(iso){
  if(!iso) return '—';
  const d = new Date(iso+'T00:00:00');
  if(isNaN(d)) return '—';
  return String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+d.getFullYear();
}
function fmtDateTime(iso){
  if(!iso) return '—';
  const d = new Date(iso);
  if(isNaN(d)) return '—';
  return fmtDate(iso.slice(0,10)) + ' · ' + String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
}
function fmtVND(n){
  if(n === null || n === undefined || n === '') return '—';
  n = Number(n);
  if(isNaN(n)) return '—';
  if(n >= 1000000000) return (n/1000000000).toFixed(n%1000000000===0?0:1).replace(/\.0$/,'') + ' tỷ';
  if(n >= 1000000) return (n/1000000).toFixed(n%1000000===0?0:1).replace(/\.0$/,'') + ' tr';
  return n.toLocaleString('vi-VN') + 'đ';
}
function fmtVNDFull(n){
  if(n === null || n === undefined || n === '') return '—';
  n = Number(n); if(isNaN(n)) return '—';
  return n.toLocaleString('vi-VN') + ' VNĐ';
}
function daysDiff(iso){ // positive = future, negative = past, from today
  if(!iso) return null;
  const d = new Date(iso+'T00:00:00'), t = new Date(todayISO()+'T00:00:00');
  return Math.round((d-t)/86400000);
}
function toISODate(d){ return d.toISOString().slice(0,10); }
function buildWeekBuckets(n){
  const now = new Date();
  const dow = now.getDay() || 7; // 1=Mon..7=Sun
  const monday = new Date(now); monday.setDate(now.getDate() - dow + 1);
  const buckets = [];
  for(let i=n-1;i>=0;i--){
    const start = new Date(monday); start.setDate(monday.getDate() - i*7);
    const end = new Date(start); end.setDate(start.getDate()+6);
    buckets.push({
      label: `${String(start.getDate()).padStart(2,'0')}/${String(start.getMonth()+1).padStart(2,'0')}`,
      sub: `Tuần ${String(start.getDate()).padStart(2,'0')}/${String(start.getMonth()+1).padStart(2,'0')} – ${String(end.getDate()).padStart(2,'0')}/${String(end.getMonth()+1).padStart(2,'0')}`,
      start: toISODate(start), end: toISODate(end),
    });
  }
  return buckets;
}
function buildMonthBuckets(n){
  const now = new Date();
  const buckets = [];
  for(let i=n-1;i>=0;i--){
    const d = new Date(now.getFullYear(), now.getMonth()-i, 1);
    const start = new Date(d.getFullYear(), d.getMonth(), 1);
    const end = new Date(d.getFullYear(), d.getMonth()+1, 0);
    buckets.push({
      label: `T${d.getMonth()+1}/${d.getFullYear()}`,
      sub: `Tháng ${d.getMonth()+1}/${d.getFullYear()}`,
      start: toISODate(start), end: toISODate(end),
    });
  }
  return buckets;
}
function countLeadsInBuckets(buckets){
  return buckets.map(b => STATE.customers.filter(c=>{
    const cd = (c.createdAt||'').slice(0,10);
    return cd && cd >= b.start && cd <= b.end;
  }).length);
}
function escapeHtml(str){
  if(str===null||str===undefined) return '';
  return String(str).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function escAttr(str){ return escapeHtml(str).replace(/`/g,'&#96;'); }

async function loadState(){
  if(!supabaseClient){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      if(raw){ STATE = JSON.parse(raw); return true; }
    }catch(e){ console.error('load error', e); }
    return false;
  }
  try{
    const [cRes, dRes, aRes, nRes, mRes] = await Promise.all([
      supabaseClient.from('customers').select('*'),
      supabaseClient.from('deals').select('*'),
      supabaseClient.from('activities').select('*'),
      supabaseClient.from('next_actions').select('*'),
      supabaseClient.from('meetings').select('*'),
    ]);
    for(const r of [cRes,dRes,aRes,nRes,mRes]) if(r.error) throw r.error;
    STATE = {
      customers: cRes.data.map(rowToCustomer),
      deals: dRes.data.map(rowToDeal),
      activities: aRes.data.map(rowToActivity),
      nextActions: nRes.data.map(rowToNextAction),
      meetings: mRes.data.map(rowToMeeting),
    };
    return true;
  }catch(e){
    console.error('load error', e);
    showToast('Không thể tải dữ liệu từ máy chủ. Kiểm tra kết nối mạng / cấu hình Supabase.', true);
    return false;
  }
}

let _savingState = false, _savePending = false;
async function saveState(){
  if(!supabaseClient){
    try{
      localStorage.setItem(STORAGE_KEY, JSON.stringify(STATE));
    }catch(e){ console.error('save error', e); showToast('Không thể lưu dữ liệu (bộ nhớ đầy?)', true); }
    return;
  }
  // Full-sync toàn bộ 5 bảng theo đúng thứ tự để tránh vi phạm foreign key
  // (customers trước, rồi deals, rồi activities/next_actions/meetings).
  // Gộp các lượt gọi liên tiếp lại thành 1 lượt sync mới nhất (tránh spam request).
  if(_savingState){ _savePending = true; return; }
  _savingState = true;
  try{
    do{
      _savePending = false;
      await syncTable('customers', STATE.customers, customerToRow);
      await syncTable('deals', STATE.deals, dealToRow);
      await Promise.all([
        syncTable('activities', STATE.activities, activityToRow),
        syncTable('next_actions', STATE.nextActions, nextActionToRow),
        syncTable('meetings', STATE.meetings, meetingToRow),
      ]);
    } while(_savePending);
  }catch(e){
    console.error('save error', e);
    showToast('Không thể lưu dữ liệu lên máy chủ. Thử lại sau.', true);
  }finally{
    _savingState = false;
  }
}

function getCustomer(id){ return STATE.customers.find(c=>c.id===id); }
function getDeal(id){ return STATE.deals.find(d=>d.id===id); }
function dealsOf(customerId){ return STATE.deals.filter(d=>d.customerId===customerId); }
function validDeals(){ return STATE.deals.filter(d=>!!getCustomer(d.customerId)); }
function activitiesOf(customerId){ return STATE.activities.filter(a=>a.customerId===customerId).sort((a,b)=> b.date.localeCompare(a.date)); }
function owners(){ return [...new Set(STATE.customers.map(c=>c.owner).filter(Boolean))]; }
function services(){ return [...new Set(STATE.deals.map(d=>d.service).filter(Boolean))]; }

function addActivity(customerId, dealId, text){
  STATE.activities.push({ id: uid(), customerId, dealId: dealId||null, date: new Date().toISOString(), content: text });
}

/* ---------------- Next actions (freeform, per customer) ---------------- */
function nextActionsOf(customerId){
  return STATE.nextActions.filter(n=>n.customerId===customerId)
    .sort((a,b)=> (a.done - b.done) || (a.dueDate||'9999-99-99').localeCompare(b.dueDate||'9999-99-99') || a.createdAt.localeCompare(b.createdAt));
}
function allPendingNextActions(){
  return STATE.nextActions.filter(n=>!n.done && getCustomer(n.customerId))
    .sort((a,b)=> (a.dueDate||'9999-99-99').localeCompare(b.dueDate||'9999-99-99'));
}
function addNextActionForCustomer(customerId){
  const textEl = document.getElementById('na_text');
  const text = textEl.value.trim();
  if(!text) return;
  const dueDate = document.getElementById('na_due').value || null;
  const dealSel = document.getElementById('na_deal');
  const dealId = dealSel ? (dealSel.value || null) : null;
  STATE.nextActions.push({ id: uid(), customerId, dealId, text, dueDate, done:false, createdAt: new Date().toISOString() });
  addActivity(customerId, dealId, `Thêm next action: ${text}`);
  const c = getCustomer(customerId); if(c) c.updatedAt = new Date().toISOString();
  saveState();
  showToast('Đã thêm next action');
  renderCustomerDetailIfOpen(true);
}
function toggleNextActionDone(naId){
  const na = STATE.nextActions.find(n=>n.id===naId);
  if(!na) return;
  na.done = !na.done;
  saveState();
  renderCustomerDetailIfOpen(true);
}
function toggleNextActionDoneGlobal(naId){
  const na = STATE.nextActions.find(n=>n.id===naId);
  if(!na) return;
  na.done = !na.done;
  saveState();
  render();
}
function deleteNextAction(naId){
  STATE.nextActions = STATE.nextActions.filter(n=>n.id!==naId);
  saveState();
  showToast('Đã xoá next action');

/* ---------------- Follow-up / alert calculations ---------------- */
function followupBuckets(){
  const overdue = [], today = [], soon = [];
  validDeals().forEach(d=>{
    if(['won','lost'].includes(d.dealStage)) return;
    const diff = daysDiff(d.nextFollowUp);
    if(diff === null) return;
    if(diff < 0) overdue.push(d);
    else if(diff === 0) today.push(d);
    else if(diff <= 3) soon.push(d);
  });
  return {overdue, today, soon};
}
function deadlineSoonDeals(days){
  return validDeals().filter(d=>{
    if(['won','lost'].includes(d.dealStage)) return false;
    const diff = daysDiff(d.deadline);
    return diff !== null && diff >= 0 && diff <= days;
  });
}
function staleHighValueDeals(){
  // High value, no follow-up date set in next 5 days and not updated recently (proxy: nextFollowUp overdue or empty)
  return validDeals().filter(d=>{
    if(['won','lost'].includes(d.dealStage)) return false;
    if(!d.value || d.value < 200000000) return false;
    const diff = daysDiff(d.nextFollowUp);
    return diff === null || diff < 0;
  });
}

  const delta = last - prev;
  const deltaPct = prev>0 ? Math.round((delta/prev)*100) : (last>0? 100 : 0);
  const deltaTone = delta>0 ? 'green' : (delta<0 ? 'red' : '');
  const deltaIcon = delta>0 ? '▲' : (delta<0 ? '▼' : '·');

  const currentBucket = buckets[buckets.length-1];
  const periodCustomers = STATE.customers.filter(c=>{
    const cd=(c.createdAt||'').slice(0,10);
    return cd && cd>=currentBucket.start && cd<=currentBucket.end;
  });

let DASHBOARD_CHART = null;
function renderDashboardLeadChart(){

  if(DASHBOARD_CHART){ DASHBOARD_CHART.destroy(); DASHBOARD_CHART = null; }
  const period = UI.leadReportPeriod || 'week';
  const buckets = period==='week' ? buildWeekBuckets(8) : buildMonthBuckets(6);
  const counts = countLeadsInBuckets(buckets);
  DASHBOARD_CHART = new Chart(canvas, {
    type:'bar',
    data:{
      labels: buckets.map(b=>b.label),
      datasets:[{ data: counts, backgroundColor: counts.map((v,i)=> i===counts.length-1 ? '#2f5eff' : 'rgba(47,94,255,0.32)'), borderRadius:6, maxBarThickness:30 }]
    },
    options:{
      plugins:{ legend:{display:false}, tooltip:{ callbacks:{ title: (items)=> buckets[items[0].dataIndex].sub } } },

function exportLeadReportExcel(){
  if(typeof XLSX === 'undefined'){ showToast('Không thể tải thư viện Excel. Kiểm tra kết nối mạng và thử lại.', true); return; }
  const period = UI.leadReportPeriod || 'week';
  const buckets = period==='week' ? buildWeekBuckets(8) : buildMonthBuckets(6);
  const counts = countLeadsInBuckets(buckets);

  const summaryRows = [[ period==='week' ? 'Tuần' : 'Tháng', 'Khoảng thời gian', 'Số lead mới']];
  buckets.forEach((b,i)=> summaryRows.push([b.label, `${fmtDate(b.start)} - ${fmtDate(b.end)}`, counts[i]]));

  const detailRows = [['Tên khách hàng','Người liên hệ','SĐT','Email','Trạng thái','Ngày vào lead','Người phụ trách','Nguồn']];
  [...STATE.customers].sort((a,b)=>(a.createdAt||'').localeCompare(b.createdAt||'')).forEach(c=>{
    detailRows.push([c.name, c.contact||'', c.phone||'', c.email||'', statusMeta(c.status).label, fmtDate((c.createdAt||'').slice(0,10)), c.owner||'', c.source||'']);
  });

  const wb = XLSX.utils.book_new();
  const ws1 = XLSX.utils.aoa_to_sheet(summaryRows);
  ws1['!cols'] = [{wch:14},{wch:24},{wch:14}];
  const ws2 = XLSX.utils.aoa_to_sheet(detailRows);
  ws2['!cols'] = [{wch:24},{wch:18},{wch:16},{wch:24},{wch:14},{wch:14},{wch:14},{wch:16}];
  XLSX.utils.book_append_sheet(wb, ws1, period==='week' ? 'Theo tuần' : 'Theo tháng');
  XLSX.utils.book_append_sheet(wb, ws2, 'Chi tiết khách hàng');
  XLSX.writeFile(wb, `midas-crm-lead-report-${todayISO()}.xlsx`);
  showToast('Đã xuất file Excel');
}

/* ================= CUSTOMERS ================= */
function filteredCustomers(){
  let list = [...STATE.customers];
  const q = UI.search.trim().toLowerCase();
  if(q){
    list = list.filter(c=>{
      const dealNames = dealsOf(c.id).map(d=>d.name+' '+d.service).join(' ').toLowerCase();
      return [c.name,c.contact,c.phone,c.email].join(' ').toLowerCase().includes(q) || dealNames.includes(q);
    });
  }
  const f = UI.custFilters;
  if(f.status) list = list.filter(c=>c.status===f.status);
  if(f.owner) list = list.filter(c=>c.owner===f.owner);
  if(f.service) list = list.filter(c=> dealsOf(c.id).some(d=>d.service===f.service));
  if(f.followup==='overdue') list = list.filter(c=> dealsOf(c.id).some(d=>!['won','lost'].includes(d.dealStage) && daysDiff(d.nextFollowUp)<0));
  if(f.followup==='today') list = list.filter(c=> dealsOf(c.id).some(d=>!['won','lost'].includes(d.dealStage) && daysDiff(d.nextFollowUp)===0));
  if(f.timeRange==='week' || f.timeRange==='month'){
    const b = f.timeRange==='week' ? buildWeekBuckets(1)[0] : buildMonthBuckets(1)[0];
    list = list.filter(c=>{ const cd=(c.createdAt||'').slice(0,10); return cd && cd>=b.start && cd<=b.end; });
  } else if(f.timeRange==='custom' && (f.dateFrom || f.dateTo)){
    list = list.filter(c=>{
      const cd = (c.createdAt||'').slice(0,10);
      if(!cd) return false;
      if(f.dateFrom && cd < f.dateFrom) return false;
      if(f.dateTo && cd > f.dateTo) return false;
      return true;
    });
  }
  return list.sort((a,b)=> (b.updatedAt||'').localeCompare(a.updatedAt||''));
}

function dateFilterLabel(){
  const f = UI.custFilters;
  if(f.timeRange==='week') return 'Lead tuần này';
  if(f.timeRange==='month') return 'Lead tháng này';
  if(f.timeRange==='custom'){
    if(f.dateFrom && f.dateTo) return `${fmtDate(f.dateFrom)} – ${fmtDate(f.dateTo)}`;
    if(f.dateFrom) return `Từ ${fmtDate(f.dateFrom)}`;
    if(f.dateTo) return `Đến ${fmtDate(f.dateTo)}`;
  }
  return 'Tất cả thời gian';
}

let dragDealId = null;
function handleDragStart(ev, dealId){
  dragDealId = dealId;
  ev.target.classList.add('dragging');
  ev.dataTransfer.effectAllowed = 'move';
}
function handleDrop(ev, stageId){
  ev.preventDefault();
  ev.currentTarget.classList.remove('drag-over');
  if(!dragDealId) return;
  const deal = getDeal(dragDealId);
  if(deal && deal.dealStage !== stageId){
    const from = stageMeta(deal.dealStage).label;
    deal.dealStage = stageId;
    addActivity(deal.customerId, deal.id, `Deal "${deal.name}" chuyển từ ${from} sang ${stageMeta(stageId).label}.`);
    const c = getCustomer(deal.customerId);
    if(c) c.updatedAt = new Date().toISOString();
    saveState();
    showToast(`Đã cập nhật trạng thái deal sang "${stageMeta(stageId).label}"`);
  }
  dragDealId = null;
  if(UI.view==='pipeline') renderPipelineBoardOnly();
}

/* ================= CALENDAR ================= */
function renderCalendar(){
  const y = UI.calendarYear, m = UI.calendarMonthIdx;
  const first = new Date(y, m, 1);
  const startOffset = (first.getDay()+6)%7; // Monday=0 .. Sunday=6
  const daysInMonth = new Date(y, m+1, 0).getDate();
  const monthLabel = `Tháng ${m+1}/${y}`;

  let cells = '';
  for(let i=0;i<startOffset;i++) cells += `<div class="cal-cell cal-empty"></div>`;
  for(let day=1; day<=daysInMonth; day++){
    const dateStr = `${y}-${String(m+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
    const dayMeetings = meetingsOn(dateStr);
    const isToday = dateStr === todayISO();
    cells += `<div class="cal-cell ${isToday?'cal-today':''}" onclick="openDayMeetings('${dateStr}')">
      <div class="cal-daynum">${day}</div>
      ${dayMeetings.slice(0,2).map(mt=>`<div class="cal-chip">${mt.time? escapeHtml(mt.time)+' ':''}${escapeHtml(mt.title)}</div>`).join('')}
      ${dayMeetings.length>2? `<div class="cal-more">+${dayMeetings.length-2} khác</div>`:''}
    </div>`;
  }

  return `
  <div class="card" style="padding:18px;margin-bottom:22px">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:10px">
      <div style="display:flex;align-items:center;gap:6px">
        <button class="btn btn-ghost btn-sm" onclick="shiftCalendarMonth(-1)">‹</button>
        <h3 style="font-size:15px;min-width:120px;text-align:center">${monthLabel}</h3>
        <button class="btn btn-ghost btn-sm" onclick="shiftCalendarMonth(1)">›</button>
      </div>
      <button class="btn btn-sm" onclick="goToCurrentMonth()">${ICONS.clock} Hôm nay</button>
    </div>
    <div class="cal-grid cal-head-row">
      ${['T2','T3','T4','T5','T6','T7','CN'].map(d=>`<div class="cal-headcell">${d}</div>`).join('')}
    </div>
    <div class="cal-grid">${cells}</div>
  </div>
  <div class="section-head"><h3>Lịch hẹn sắp tới</h3></div>
  ${renderUpcomingMeetingsList()}
  `;
}

function shiftCalendarMonth(delta){
  let m = UI.calendarMonthIdx + delta, y = UI.calendarYear;
  if(m<0){ m=11; y--; } else if(m>11){ m=0; y++; }
  UI.calendarMonthIdx = m; UI.calendarYear = y;
  render();
}
function goToCurrentMonth(){
  const now = new Date();
  UI.calendarYear = now.getFullYear(); UI.calendarMonthIdx = now.getMonth();
  render();
}

function openMeetingModal(meetingId, presetDate){
  const mt = meetingId ? getMeeting(meetingId) : null;
  const isEdit = !!mt;
  if(!STATE.customers.length){ showToast('Cần thêm khách hàng trước khi đặt lịch meeting', true); return; }
  openModal(`
    <div class="modal-head"><h3>${isEdit? 'Chỉnh sửa lịch hẹn' : 'Đặt lịch meeting'}</h3><button class="modal-close" onclick="closeModal()">${ICONS.x}</button></div>
    <div class="modal-body">
      <div class="form-grid">
        <div class="form-field full"><label>Tiêu đề *</label><input id="mt_title" value="${escAttr(mt?.title||'')}" placeholder="VD: Trình bày proposal SEO"></div>
        <div class="form-field full"><label>Khách hàng *</label>
          <select id="mt_customer" onchange="renderMeetingDealOptions(this.value)">${STATE.customers.map(c=>`<option value="${c.id}" ${mt?.customerId===c.id?'selected':''}>${escapeHtml(c.name)}</option>`).join('')}</select>
        </div>
        <div class="form-field full" id="mt_deal_wrap"></div>
        <div class="form-field"><label>Ngày *</label><input id="mt_date" type="date" value="${mt?.date || presetDate || todayISO()}"></div>
        <div class="form-field"><label>Giờ</label><input id="mt_time" type="time" value="${mt?.time||''}"></div>
        <div class="form-field full"><label>Địa điểm / Link</label><input id="mt_location" value="${escAttr(mt?.location||'')}" placeholder="Văn phòng khách hàng, Google Meet, Zoom..."></div>
        <div class="form-field full"><label>Mục đích / Ghi chú</label><textarea id="mt_note" placeholder="VD: Trình bày proposal, chốt ngân sách, ký hợp đồng...">${escapeHtml(mt?.note||'')}</textarea></div>
      </div>
    </div>
    <div class="modal-foot">
      ${isEdit? `<button class="btn btn-danger" style="margin-right:auto" onclick="confirmDeleteMeeting('${mt.id}')">${ICONS.trash} Xoá lịch hẹn</button>`:''}
      <button class="btn" onclick="closeModal()">Huỷ</button>
      <button class="btn btn-primary" onclick="saveMeeting(${mt? `'${mt.id}'`:'null'})">${ICONS.check} ${isEdit?'Lưu thay đổi':'Đặt lịch'}</button>
    </div>
  `, 'modal-lg');
  const initialCustomerId = mt?.customerId || document.getElementById('mt_customer')?.value;
  renderMeetingDealOptions(initialCustomerId, mt?.dealId);
  setTimeout(()=>document.getElementById('mt_title')?.focus(), 50);
}

function renderMeetingDealOptions(customerId, selectedDealId){
  const wrap = document.getElementById('mt_deal_wrap');
  if(!wrap) return;
  const deals = customerId ? dealsOf(customerId).filter(d=>!['won','lost'].includes(d.dealStage)) : [];
  wrap.innerHTML = `
    <label>Deal liên quan (tuỳ chọn)</label>
    <select id="mt_deal">
      <option value="">Không gắn deal cụ thể</option>
      ${deals.map(d=>`<option value="${d.id}" ${selectedDealId===d.id?'selected':''}>${escapeHtml(d.name)}</option>`).join('')}
    </select>`;
}

function saveMeeting(meetingId){
  const title = document.getElementById('mt_title').value.trim();
  const customerId = document.getElementById('mt_customer').value;
  const date = document.getElementById('mt_date').value;
  if(!title){ showToast('Vui lòng nhập tiêu đề buổi hẹn', true); return; }
  if(!date){ showToast('Vui lòng chọn ngày hẹn', true); return; }
  const payload = {
    title, customerId, date,
    time: document.getElementById('mt_time').value,
    dealId: document.getElementById('mt_deal')?.value || null,
    location: document.getElementById('mt_location').value.trim(),
    note: document.getElementById('mt_note').value.trim(),
  };
  let isEdit = false;
  if(meetingId){
    isEdit = true;
    Object.assign(getMeeting(meetingId), payload);
    showToast('Đã cập nhật lịch hẹn');
  } else {
    const id = uid();
    STATE.meetings.push({ id, ...payload, createdAt: new Date().toISOString() });
    showToast('Đã đặt lịch meeting');
  }

  let noteText = `${isEdit? 'Cập nhật lịch hẹn' : 'Đặt lịch meeting'} "${title}" vào ${fmtDate(date)}${payload.time? ' lúc '+payload.time:''}`;
  if(payload.location) noteText += ` tại ${payload.location}`;
  noteText += '.';
  if(payload.note) noteText += ` Mục đích: ${payload.note}`;
  addActivity(customerId, payload.dealId, noteText);
  const c = getCustomer(customerId); if(c) c.updatedAt = new Date().toISOString();
  saveState();
  closeModal();
  render();
}

function confirmDeleteMeeting(meetingId){
  const mt = getMeeting(meetingId);
  openConfirmModal('Xoá lịch hẹn?', `Lịch hẹn "${mt.title}" sẽ bị xoá vĩnh viễn.`, ()=>{
    STATE.meetings = STATE.meetings.filter(x=>x.id!==meetingId);
    saveState(); closeModal(); render();
    showToast('Đã xoá lịch hẹn');
  });
}

let CHART_INSTANCES = [];
function renderCharts(){
  CHART_INSTANCES.forEach(ch=>ch.destroy());
  CHART_INSTANCES = [];
  const blue='#2f5eff', violet='#7c5cff', amber='#d98a1f', green='#1a9e6f', red='#e5484d', gray='#8892ab';
  const palette=[blue,violet,amber,green,red,'#0fb5c8','#c9790f',gray];

  // Customer status doughnut
  const ctx1 = document.getElementById('chartCustStatus');
  if(ctx1){
    const data = CUSTOMER_STATUSES.map(s=>STATE.customers.filter(c=>c.status===s.id).length);
    CHART_INSTANCES.push(new Chart(ctx1, {
      type:'doughnut',
      data:{ labels: CUSTOMER_STATUSES.map(s=>s.label), datasets:[{ data, backgroundColor: CUSTOMER_STATUSES.map(s=>s.color), borderWidth:2, borderColor:'#fff' }] },
      options:{ plugins:{legend:{position:'bottom', labels:{boxWidth:10, font:{size:10.5, family:'Montserrat'}}}}, cutout:'62%' }
    }));
  }
  // Deal value by stage bar
  const ctx2 = document.getElementById('chartDealStage');
  if(ctx2){
    const data = DEAL_STAGES.map(s=> validDeals().filter(d=>d.dealStage===s.id).reduce((sum,d)=>sum+(Number(d.value)||0),0));
    CHART_INSTANCES.push(new Chart(ctx2, {
      type:'bar',
      data:{ labels: DEAL_STAGES.map(s=>s.label), datasets:[{ data, backgroundColor: blue, borderRadius:6, maxBarThickness:34 }] },
      options:{ plugins:{legend:{display:false}}, scales:{ y:{ ticks:{ callback:v=>fmtVND(v) } } } }
    }));
  }
  // Deals by owner
  const ctx3 = document.getElementById('chartOwner');
  if(ctx3){
    const own = owners();
    const data = own.map(o=>validDeals().filter(d=>d.owner===o && !['won','lost'].includes(d.dealStage)).length);
    CHART_INSTANCES.push(new Chart(ctx3, {
      type:'bar',
      data:{ labels: own, datasets:[{ data, backgroundColor: violet, borderRadius:6, maxBarThickness:34 }] },
      options:{ indexAxis:'y', plugins:{legend:{display:false}} }
    }));
  }
  // Deals by service
  const ctx4 = document.getElementById('chartService');
  if(ctx4){
    const svc = services();
    const data = svc.map(s=>validDeals().filter(d=>d.service===s).length);
    CHART_INSTANCES.push(new Chart(ctx4, {
      type:'pie',
      data:{ labels: svc, datasets:[{ data, backgroundColor: palette, borderWidth:2, borderColor:'#fff' }] },
      options:{ plugins:{legend:{position:'bottom', labels:{boxWidth:10, font:{size:10.5, family:'Montserrat'}}}} }
    }));
  }
}

function exportFullReportExcel(){
  if(typeof XLSX === 'undefined'){ showToast('Không thể tải thư viện Excel. Kiểm tra kết nối mạng và thử lại.', true); return; }
  const openDeals = validDeals().filter(d=>!['won','lost'].includes(d.dealStage));
  const wonDeals = validDeals().filter(d=>d.dealStage==='won');
  const lostDeals = validDeals().filter(d=>d.dealStage==='lost');
  const totalOpenValue = openDeals.reduce((s,d)=>s+(Number(d.value)||0),0);
  const totalWonValue = wonDeals.reduce((s,d)=>s+(Number(d.value)||0),0);
  const winRate = (wonDeals.length+lostDeals.length)>0 ? Math.round(wonDeals.length/(wonDeals.length+lostDeals.length)*100) : 0;

  const wb = XLSX.utils.book_new();

  const overviewRows = [
    ['Chỉ số','Giá trị'],
    ['Tổng khách hàng', STATE.customers.length],
    ['Deal đang mở', openDeals.length],
    ['Tổng giá trị pipeline mở', totalOpenValue],
    ['Deal đã chốt', wonDeals.length],
    ['Giá trị đã chốt', totalWonValue],
    ['Deal thất bại', lostDeals.length],
    ['Tỷ lệ chốt deal (%)', winRate],
  ];
  const wsOverview = XLSX.utils.aoa_to_sheet(overviewRows);
  wsOverview['!cols'] = [{wch:26},{wch:18}];
  XLSX.utils.book_append_sheet(wb, wsOverview, 'Tổng quan');

  const statusRows = [['Trạng thái','Số khách hàng']];
  CUSTOMER_STATUSES.forEach(s=> statusRows.push([s.label, STATE.customers.filter(c=>c.status===s.id).length]));
  const wsStatus = XLSX.utils.aoa_to_sheet(statusRows);
  wsStatus['!cols'] = [{wch:18},{wch:16}];
  XLSX.utils.book_append_sheet(wb, wsStatus, 'KH theo trạng thái');

  const stageRows = [['Giai đoạn','Số deal','Tổng giá trị']];
  DEAL_STAGES.forEach(s=>{
    const ds = validDeals().filter(d=>d.dealStage===s.id);
    stageRows.push([s.label, ds.length, ds.reduce((sum,d)=>sum+(Number(d.value)||0),0)]);
  });
  const wsStage = XLSX.utils.aoa_to_sheet(stageRows);
  wsStage['!cols'] = [{wch:16},{wch:12},{wch:18}];
  XLSX.utils.book_append_sheet(wb, wsStage, 'Deal theo giai đoạn');

  const own = owners();
  const ownerRows = [['Người phụ trách','Deal đang mở','Tổng giá trị mở']];
  own.forEach(o=>{
    const ds = openDeals.filter(d=>d.owner===o);
    ownerRows.push([o, ds.length, ds.reduce((sum,d)=>sum+(Number(d.value)||0),0)]);
  });
  const wsOwner = XLSX.utils.aoa_to_sheet(ownerRows);
  wsOwner['!cols'] = [{wch:18},{wch:14},{wch:18}];
  XLSX.utils.book_append_sheet(wb, wsOwner, 'Deal theo phụ trách');

  const custRows = [['Tên','Người liên hệ','SĐT','Email','Trạng thái','Ngày vào lead','Cập nhật','Phụ trách','Nguồn']];
  STATE.customers.forEach(c=> custRows.push([c.name, c.contact||'', c.phone||'', c.email||'', statusMeta(c.status).label, fmtDate((c.createdAt||'').slice(0,10)), fmtDate((c.updatedAt||'').slice(0,10)), c.owner||'', c.source||'']));
  const wsCust = XLSX.utils.aoa_to_sheet(custRows);
  wsCust['!cols'] = [{wch:22},{wch:18},{wch:16},{wch:24},{wch:12},{wch:14},{wch:14},{wch:12},{wch:14}];
  XLSX.utils.book_append_sheet(wb, wsCust, 'Danh sách khách hàng');

  const dealRows = [['Công ty','Dự án','Dịch vụ','Giá trị','Giai đoạn','Ưu tiên','Follow-up','Deadline','Phụ trách']];
  validDeals().forEach(d=>{
    const c = getCustomer(d.customerId);
    dealRows.push([c?.name||'', d.name, d.service||'', d.value||0, stageMeta(d.dealStage).label, prioMeta(d.priority).label, fmtDate(d.nextFollowUp), fmtDate(d.deadline), d.owner||'']);
  });
  const wsDeal = XLSX.utils.aoa_to_sheet(dealRows);
  wsDeal['!cols'] = [{wch:22},{wch:24},{wch:16},{wch:14},{wch:14},{wch:10},{wch:12},{wch:12},{wch:12}];
  XLSX.utils.book_append_sheet(wb, wsDeal, 'Danh sách deal');

  XLSX.writeFile(wb, `midas-crm-report-${todayISO()}.xlsx`);
  showToast('Đã xuất báo cáo Excel');
}

/* ================= MODAL ENGINE ================= */
function openModal(innerHtml, extraClass){
  closeModal();
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.id = 'modalOverlay';
  overlay.onclick = (e)=>{ if(e.target===overlay) closeModal(); };
  overlay.innerHTML = `<div class="modal ${extraClass||''}">${innerHtml}</div>`;
  document.body.appendChild(overlay);
  document.addEventListener('keydown', escCloseHandler);
}
function closeModal(){
  const el = document.getElementById('modalOverlay');
  if(el) el.remove();
  document.removeEventListener('keydown', escCloseHandler);
}
function escCloseHandler(e){ if(e.key==='Escape') closeModal(); }

function openConfirmModal(title, msg, onConfirm){
  openModal(`
    <div class="confirm-box">
      <div class="icon-wrap">${ICONS.alert}</div>
      <h3>${escapeHtml(title)}</h3>
      <p>${escapeHtml(msg)}</p>
      <div class="actions">
        <button class="btn" onclick="closeModal()">Huỷ</button>
        <button class="btn btn-danger" id="confirmActionBtn" style="border-color:var(--red)">Xác nhận</button>
      </div>
    </div>
  `);
  document.getElementById('confirmActionBtn').onclick = onConfirm;
}

function saveCustomer(customerId){
  const name = document.getElementById('f_name').value.trim();
  if(!name){ showToast('Vui lòng nhập tên khách hàng / công ty', true); return; }
  const now = new Date().toISOString();
  const leadDate = document.getElementById('f_leaddate').value || todayISO();
  const payload = {
    name,
    contact: document.getElementById('f_contact').value.trim(),
    position: document.getElementById('f_position').value.trim(),
    phone: document.getElementById('f_phone').value.trim(),
    email: document.getElementById('f_email').value.trim(),
    website: document.getElementById('f_website').value.trim(),
    industry: document.getElementById('f_industry').value.trim(),
    source: document.getElementById('f_source').value,
    owner: document.getElementById('f_owner').value.trim(),
    status: document.getElementById('f_status').value,
    note: document.getElementById('f_note').value.trim(),
    createdAt: leadDate,
    updatedAt: now,
  };
  if(customerId){
    const c = getCustomer(customerId);
    Object.assign(c, payload);
    showToast('Đã cập nhật khách hàng');
  } else {
    const id = uid();
    STATE.customers.push({ id, ...payload });
    addActivity(id, null, 'Tạo hồ sơ khách hàng mới.');
    showToast('Đã thêm khách hàng mới');
  }
  saveState();
  closeModal();
  render();
}

function confirmDeleteCustomer(customerId){
  const c = getCustomer(customerId);
  const dealCount = dealsOf(customerId).length;
  openConfirmModal(
    'Xoá khách hàng?',
    `"${c.name}" và ${dealCount} deal liên quan sẽ bị xoá vĩnh viễn. Hành động này không thể hoàn tác.`,
    ()=>{
      STATE.customers = STATE.customers.filter(x=>x.id!==customerId);
      STATE.deals = STATE.deals.filter(d=>d.customerId!==customerId);
      STATE.activities = STATE.activities.filter(a=>a.customerId!==customerId);
      saveState(); closeModal();
      if(UI.detailCustomerId===customerId) UI.detailCustomerId=null;
      render();
      showToast('Đã xoá khách hàng');
    }
  );
}

function parseBulkLine(line){
  let cols = line.split('\t');
  if(cols.length < 2) cols = line.split(',');
  return cols.map(c=>c.trim());
}
function parseVNDate(str){
  const m = (str||'').trim().match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  if(!m) return null;
  return `${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;
}
function runBulkImport(){
  const raw = document.getElementById('bulkImportText').value;
  const lines = raw.split('\n').map(l=>l.trim()).filter(Boolean);
  let added = 0, skipped = 0;
  const now = new Date().toISOString();

  lines.forEach(line=>{
    const cols = parseBulkLine(line);
    const name = cols[0] || '';
    if(!name || /^(tên|họ và tên|name|customer|khách hàng)$/i.test(name)){ skipped++; return; }
    const phone = cols[1] || '';
    const email = cols[2] || '';
    const leadDate = parseVNDate(cols[3]) || todayISO();
    const refCode = cols[4] || '';
    const id = uid();
    STATE.customers.push({
      id, name, contact: name, position:'', phone, email, website:'', industry:'',
      source:'Import nhanh', owner:'Leon', status:'lead',
      note: refCode ? `Mã liên hệ: ${refCode}` : '',
      createdAt: leadDate, updatedAt: now,
    });
    addActivity(id, null, 'Tạo hồ sơ khách hàng mới (import nhanh).');
    added++;
  });

  if(added){
    saveState();
    showToast(`Đã thêm ${added} lead mới${skipped? `, bỏ qua ${skipped} dòng không hợp lệ`:''}`);
    closeModal();
    render();
  } else {
    showToast('Không có dòng dữ liệu hợp lệ nào để thêm', true);
  }
}

function saveDeal(dealId){
  const name = document.getElementById('fd_name').value.trim();
  const customerId = document.getElementById('fd_customer').value;
  if(!name){ showToast('Vui lòng nhập tên dự án / deal', true); return; }
  const payload = {
    customerId,
    name,
    service: document.getElementById('fd_service').value.trim(),
    value: document.getElementById('fd_value').value ? Number(document.getElementById('fd_value').value) : null,
    owner: document.getElementById('fd_owner').value.trim(),
    startDate: document.getElementById('fd_start').value,
    deadline: document.getElementById('fd_deadline').value,
    nextFollowUp: document.getElementById('fd_followup').value,
    dealStage: document.getElementById('fd_stage').value,
    priority: document.getElementById('fd_priority').value,
    probability: Number(document.getElementById('fd_prob').value)||0,
    nextAction: document.getElementById('fd_nextaction').value,
    note: document.getElementById('fd_note').value.trim(),
  };
  const c = getCustomer(customerId);
  if(dealId){
    Object.assign(getDeal(dealId), payload);
    addActivity(customerId, dealId, `Cập nhật thông tin deal "${name}".`);
    showToast('Đã cập nhật deal');
  } else {
    const id = uid();
    STATE.deals.push({ id, ...payload, documents: [] });
    addActivity(customerId, id, `Tạo deal mới "${name}".`);
    showToast('Đã thêm deal mới');
  }
  if(c){ c.updatedAt = new Date().toISOString(); }
  saveState();
  closeModal();
  if(UI.detailCustomerId) renderCustomerDetailIfOpen();
  render();
}

function confirmDeleteDeal(dealId){
  const d = getDeal(dealId);
  openConfirmModal('Xoá deal?', `Deal "${d.name}" sẽ bị xoá vĩnh viễn cùng lịch sử liên quan.`, ()=>{
    STATE.deals = STATE.deals.filter(x=>x.id!==dealId);
    STATE.activities = STATE.activities.filter(a=>a.dealId!==dealId);
    saveState(); closeModal(); render();
    showToast('Đã xoá deal');
  });
}

function duplicateDeal(dealId){

  saveState();
  showToast('Đã nhân bản deal');

function addDealDocument(dealId){
  const title = document.getElementById('doc_title').value.trim();
  let url = document.getElementById('doc_url').value.trim();
  const note = document.getElementById('doc_note').value.trim();
  if(!url){ showToast('Vui lòng nhập link tài liệu', true); return; }
  if(!/^https?:\/\//i.test(url)) url = 'https://' + url;
  const d = getDeal(dealId);
  if(!d.documents) d.documents = [];
  d.documents.push({ id: uid(), title: title || url, url, note, addedAt: new Date().toISOString() });
  addActivity(d.customerId, dealId, `Gắn tài liệu: ${title || url}`);
  saveState();
  showToast('Đã gắn link tài liệu');
  UI.dealDetailTab = 'docs';
  renderDealDetailIfOpen(true);
}

function deleteDealDocument(dealId, docId){
  const d = getDeal(dealId);
  if(!d || !d.documents) return;
  d.documents = d.documents.filter(x=>x.id!==docId);
  saveState();
  showToast('Đã xoá tài liệu');
  UI.dealDetailTab = 'docs';
  renderDealDetailIfOpen(true);
}

/* ================= IMPORT / EXPORT ================= */
function setExportScope(scope){ UI.exportScope = scope; render(); }

function exportScopeCustomers(scope){
  if(scope==='week'){
    const b = buildWeekBuckets(1)[0];
    return { list: STATE.customers.filter(c=>{ const cd=(c.createdAt||'').slice(0,10); return cd && cd>=b.start && cd<=b.end; }), label: `Tuần ${b.label} (${fmtDate(b.start)} - ${fmtDate(b.end)})`, suffix:'tuan' };
  }
  if(scope==='month'){
    const b = buildMonthBuckets(1)[0];
    return { list: STATE.customers.filter(c=>{ const cd=(c.createdAt||'').slice(0,10); return cd && cd>=b.start && cd<=b.end; }), label: b.sub, suffix:'thang' };
  }
  return { list: [...STATE.customers], label: 'Toàn bộ', suffix:'toanbo' };
}
function exportScopeCustomerCount(scope){ return exportScopeCustomers(scope).list.length; }

function exportFullDataExcel(){
  if(typeof XLSX === 'undefined'){ showToast('Không thể tải thư viện Excel. Kiểm tra kết nối mạng và thử lại.', true); return; }
  const scope = UI.exportScope || 'all';
  const { list: scopedCustomers, label: scopeLabel, suffix } = exportScopeCustomers(scope);
  if(!scopedCustomers.length){ showToast('Không có khách hàng nào trong phạm vi đã chọn.', true); return; }
  const scopedIds = new Set(scopedCustomers.map(c=>c.id));
  const scopedDeals = validDeals().filter(d=>scopedIds.has(d.customerId));
  const scopedActs = STATE.activities.filter(a=>scopedIds.has(a.customerId)).sort((a,b)=>a.date.localeCompare(b.date));
  const scopedNA = STATE.nextActions.filter(n=>scopedIds.has(n.customerId));
  const scopedMeetings = STATE.meetings.filter(m=>scopedIds.has(m.customerId)).sort((a,b)=>(a.date+(a.time||'')).localeCompare(b.date+(b.time||'')));
  const totalDocs = scopedDeals.reduce((s,d)=>s+((d.documents||[]).length),0);

  const wb = XLSX.utils.book_new();

  // Sheet: Tổng quan
  const overviewRows = [
    ['Phạm vi xuất', scopeLabel],
    ['Ngày xuất', fmtDate(todayISO())],
    ['Tổng khách hàng', scopedCustomers.length],
    ['Tổng deal', scopedDeals.length],
    ['Tổng lịch sử cập nhật', scopedActs.length],
    ['Tổng next action', scopedNA.length],
    ['Tổng tài liệu / proposal', totalDocs],
    ['Tổng lịch hẹn', scopedMeetings.length],
  ];
  const wsOverview = XLSX.utils.aoa_to_sheet(overviewRows);
  wsOverview['!cols'] = [{wch:24},{wch:36}];
  XLSX.utils.book_append_sheet(wb, wsOverview, 'Tổng quan');

  // Sheet: Khách hàng
  const custRows = [['Tên','Người liên hệ','Chức vụ','SĐT','Email','Website','Ngành nghề','Nguồn','Phụ trách','Trạng thái','Ngày vào lead','Cập nhật gần nhất','Ghi chú']];
  scopedCustomers.forEach(c=> custRows.push([c.name, c.contact||'', c.position||'', c.phone||'', c.email||'', c.website||'', c.industry||'', c.source||'', c.owner||'', statusMeta(c.status).label, fmtDate((c.createdAt||'').slice(0,10)), fmtDate((c.updatedAt||'').slice(0,10)), c.note||'']));
  const wsCust = XLSX.utils.aoa_to_sheet(custRows);
  wsCust['!cols'] = [{wch:22},{wch:18},{wch:18},{wch:16},{wch:24},{wch:22},{wch:16},{wch:14},{wch:12},{wch:12},{wch:14},{wch:14},{wch:36}];
  XLSX.utils.book_append_sheet(wb, wsCust, 'Khách hàng');

  // Sheet: Deal
  const dealRows = [['Công ty','Dự án','Dịch vụ','Giá trị','Giai đoạn','Ưu tiên','Xác suất %','Người phụ trách','Ngày bắt đầu','Deadline','Follow-up kế tiếp','Next Action','Ghi chú']];
  scopedDeals.forEach(d=>{
    const c = getCustomer(d.customerId);
    dealRows.push([c?.name||'', d.name, d.service||'', d.value||0, stageMeta(d.dealStage).label, prioMeta(d.priority).label, d.probability??'', d.owner||'', fmtDate(d.startDate), fmtDate(d.deadline), fmtDate(d.nextFollowUp), d.nextAction||'', d.note||'']);
  });
  const wsDeal = XLSX.utils.aoa_to_sheet(dealRows);
  wsDeal['!cols'] = [{wch:22},{wch:26},{wch:16},{wch:14},{wch:14},{wch:10},{wch:10},{wch:14},{wch:12},{wch:12},{wch:14},{wch:18},{wch:36}];
  XLSX.utils.book_append_sheet(wb, wsDeal, 'Deal');

  // Sheet: Lịch sử cập nhật (hành trình)
  const actRows = [['Ngày giờ','Khách hàng','Deal liên quan','Nội dung']];
  scopedActs.forEach(a=>{
    const c = getCustomer(a.customerId);
    const d = a.dealId ? getDeal(a.dealId) : null;
    actRows.push([fmtDateTime(a.date), c?.name||'', d?.name||'', a.content]);
  });
  const wsAct = XLSX.utils.aoa_to_sheet(actRows);
  wsAct['!cols'] = [{wch:18},{wch:22},{wch:24},{wch:60}];
  XLSX.utils.book_append_sheet(wb, wsAct, 'Lịch sử cập nhật');

  // Sheet: Next Action
  const naRows = [['Khách hàng','Deal liên quan','Việc cần làm','Hạn','Trạng thái','Ngày tạo']];
  scopedNA.forEach(n=>{
    const c = getCustomer(n.customerId);
    const d = n.dealId ? getDeal(n.dealId) : null;
    naRows.push([c?.name||'', d?.name||'', n.text, n.dueDate? fmtDate(n.dueDate):'', n.done?'Đã xong':'Đang chờ', fmtDateTime(n.createdAt)]);
  });
  const wsNA = XLSX.utils.aoa_to_sheet(naRows);
  wsNA['!cols'] = [{wch:22},{wch:24},{wch:40},{wch:12},{wch:12},{wch:18}];
  XLSX.utils.book_append_sheet(wb, wsNA, 'Next Action');

  // Sheet: Tài liệu / Proposal
  const docRows = [['Khách hàng','Deal','Tên tài liệu','Link','Ghi chú','Ngày thêm']];
  scopedDeals.forEach(d=>{
    (d.documents||[]).forEach(doc=>{
      const c = getCustomer(d.customerId);
      docRows.push([c?.name||'', d.name, doc.title||'', doc.url||'', doc.note||'', fmtDateTime(doc.addedAt)]);
    });
  });
  const wsDoc = XLSX.utils.aoa_to_sheet(docRows);
  wsDoc['!cols'] = [{wch:22},{wch:24},{wch:24},{wch:36},{wch:30},{wch:18}];
  XLSX.utils.book_append_sheet(wb, wsDoc, 'Tài liệu Proposal');

  // Sheet: Lịch hẹn
  const mtRows = [['Ngày','Giờ','Khách hàng','Deal liên quan','Tiêu đề','Địa điểm / Link','Ghi chú']];
  scopedMeetings.forEach(mt=>{
    const c = getCustomer(mt.customerId);
    const d = mt.dealId ? getDeal(mt.dealId) : null;
    mtRows.push([fmtDate(mt.date), mt.time||'', c?.name||'', d?.name||'', mt.title, mt.location||'', mt.note||'']);
  });
  const wsMt = XLSX.utils.aoa_to_sheet(mtRows);
  wsMt['!cols'] = [{wch:14},{wch:10},{wch:22},{wch:24},{wch:28},{wch:24},{wch:30}];
  XLSX.utils.book_append_sheet(wb, wsMt, 'Lịch hẹn');

  XLSX.writeFile(wb, `midas-crm-fulldata-${suffix}-${todayISO()}.xlsx`);
  showToast(`Đã xuất Excel đầy đủ (${scopeLabel})`);
}

function exportJSON(){
  const data = JSON.stringify(STATE, null, 2);
  const blob = new Blob([data], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `midas-crm-backup-${todayISO()}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  showToast('Đã export dữ liệu JSON');
}
function exportCSV(){
  const rows = [['Công ty','Người liên hệ','SĐT','Email','Trạng thái KH','Dự án','Dịch vụ','Giá trị','Giai đoạn deal','Ưu tiên','Follow-up','Deadline','Phụ trách','Next Action']];
  validDeals().forEach(d=>{
    const c = getCustomer(d.customerId);
    rows.push([c?.name||'', c?.contact||'', c?.phone||'', c?.email||'', statusMeta(c?.status).label, d.name, d.service||'', d.value||'', stageMeta(d.dealStage).label, prioMeta(d.priority).label, d.nextFollowUp||'', d.deadline||'', d.owner||'', d.nextAction||'']);
  });
  const csv = rows.map(r=>r.map(cell=>`"${String(cell).replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob(['\uFEFF'+csv], {type:'text/csv;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `midas-crm-export-${todayISO()}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  showToast('Đã export dữ liệu CSV');
}
function handleImportFile(ev){
  const file = ev.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      const data = JSON.parse(reader.result);
      if(!data || !Array.isArray(data.customers) || !Array.isArray(data.deals)) throw new Error('invalid');
      openConfirmModal('Import dữ liệu?', `File chứa ${data.customers.length} khách hàng và ${data.deals.length} deal. Dữ liệu hiện tại sẽ bị ghi đè.`, ()=>{
        STATE = { customers:data.customers||[], deals:data.deals||[], activities:data.activities||[], nextActions:data.nextActions||[], meetings:data.meetings||[] };
        saveState(); closeModal(); render();
        showToast('Đã import dữ liệu thành công');
      });
    }catch(e){
      showToast('File không hợp lệ. Vui lòng chọn đúng file JSON đã export.', true);
    }
  };
  reader.readAsText(file);
  ev.target.value = '';
}

/* ================= INIT ================= */
initApp();
</script>
